name = "lkphone-server"
main = "index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
name = "lkphone-db"
binding = "DB"
database_id = "YOUR_DATABASE_ID"
preview_database_id = "YOUR_PREVIEW_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"
